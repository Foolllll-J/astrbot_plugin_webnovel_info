help: |
  网文搜索助手：聚合起点、刺猬猫、番茄、七猫、飞卢、菠萝包等多平台小说搜索与详情查询，支持章节试读与个人书架管理。

  搜索指令（按平台）：
  - /起点 <书名/作者>（别名 /qd）
  - /刺猬猫 <书名/作者>（别名 /cwm）
  - /番茄 <书名/作者>（别名 /fq）
  - /七猫 <书名/作者>（别名 /qm、/纵横）
  - /飞卢 <书名/作者>（别名 /fl）
  - /菠萝包 <书名/作者>（别名 /blb）
  - /三江：起点三江频道推荐书单

  搜索后翻页与详情：
  - /qd n：下一页，/qd p：上一页（也支持 next/prev）
  - /qd <序号>：查看对应书籍详情（各平台别名同理）

  书架管理：
  - /查看书架（别名 /书架、/我的书架）；/书架 <序号> 查看详情，支持翻页
  - /添加书架 <序号>（别名 /加书架）添加当前搜索结果中的书籍；直接 /加书架 添加最近查看详情的书籍
  - /移除书架 <序号>（别名 /删书）；直接 /删书 移除最近查看详情的书籍
